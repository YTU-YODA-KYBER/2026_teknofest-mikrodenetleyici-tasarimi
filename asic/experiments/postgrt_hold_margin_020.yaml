#    DIKKAT: metrics.json'daki `design__instance__count__hold_buffer = 350`
#    YANILTICIDIR; o yalnizca SON resizer cagrisinin sayacidir.
#
#  ARSIVDE OLCULEN SUPURME (strateji_denemeleri.md:1096-1116)
#      marj  | hold WS  | ihlalli uc | std hucre
#      0,45  | +0,0570  |     0      | 264.845
