#      2. experiments/rsz_dont_touch_clock_root.yaml (saat kokunden
#         ~2 ns insertion kalkar)
#    Bu ikisi olculmeden marji indirmek, arsivin 0,05 sonucunu
#    (28 ihlalli uc) tekrar uretme riski tasir.
#
#  BEKLENEN: ~-8.000 hold hucresi, ~0,18 mm² alan.
#  DOGRULAMA DURUMU: HENUZ KOSULMADI. Yukaridaki iki deneyden SONRA kosulacak.
# ---------------------------------------------------------------------------
