meta:
  version: 2

# ===========================================================================
#  TESLIM PAKETINI TAMAMLAMA KATMANI
#
#  NE ZAMAN KULLANILIR?
#    Nihai kosum ONCE ana config ile, yani LibreLane'in KATI varsayilanlariyla
#    (butun ERROR_ON_* = true) baslatilir. Temiz biterse bu dosyaya hic ihtiyac
#    olmaz ve `make asic_run` sartnameye tam uyumlu kalir.
#
#    Bir signoff checker'inda durursa, `--overwrite VERMEDEN` ayni kosum
#    etiketinden, duran adimin state'inden bu overlay ile devam edilir:
#
#      python3 scripts/run_flow.py --config config.yaml \
#          --config experiments/diagnostic_continue.yaml \
#          --tag final --from <DuranAdim>
#
#    Boylece GDS / DEF / LEF / SPEF / SPICE / STA / IR-drop / LVS / DRC / XOR
#    ciktilarinin TAMAMI TEK bir calisma dizininden uretilir (sartname Bolum 6:
#    "Mumkun oldugunca ayni LibreLane calismasindan uretilmelidir").
#
#  NEDEN GIZLEME DEGIL?
#    Bu bayraklar bir kontrolu KAPATMAZ. Ilgili adimlarin hepsi (Magic DRC,
#    KLayout DRC, Netgen LVS, CheckAntennas, XOR, DisconnectedPins, TrDRC)
#    kosmaya ve ihlalleri saymaya devam eder; degisen tek sey "ilk ihlalde
#    akisi durdur" davranisidir. Kapali birakilirsa akis DRC kontrolcusunde
#    olur ve teslim edilecek HICBIR fiziksel cikti uretilmez -- bes gun boyunca
#    tam olarak bu yasandi (Checker.TrDRC, Classic akisinda GDS/STA/LVS'den
#    ONCE gelir).
#
#    Sartname Bolum 7: "Ihlal, hata veya uyari bulunmasi teslimin otomatik
#    olarak gecersiz sayilmasi anlamina gelmez." Bolum 1.1'in yasagi ise
#    esiklerin *ihlalleri GIZLEMEK amaciyla* degistirilmesine yoneliktir.
#    Burada tam tersi yapilir: gercek sayilar metrics.json'dan okunup
#    README'nin "Bilinen sorunlar" ve "Signoff sonuc ozeti" bolumlerine AYNEN
#    yazilir, ham raporlar (top_module.drc, drc.magic.rpt, drc.klayout.lyrdb,
#    lvs.netgen.rpt, antenna.rpt, xor.xml) teslim paketinin icinde gider ve bu
#    sapma README'nin "Referans yapilandirmadan sapmalar" bolumunde beyan
#    edilir.
# ===========================================================================

# --- Fiziksel signoff kontrolculeri ---------------------------------------
ERROR_ON_TR_DRC: false          # detailed routing DRC isaretleri
ERROR_ON_MAGIC_DRC: false       # Magic DRC
ERROR_ON_KLAYOUT_DRC: false     # KLayout DRC
ERROR_ON_KLAYOUT_DENSITY: false # KLayout yogunluk kurallari
ERROR_ON_KLAYOUT_ANTENNA: false # KLayout anten kurallari
ERROR_ON_LVS_ERROR: false       # Netgen LVS
ERROR_ON_XOR_ERROR: false       # Magic <-> KLayout GDSII geometrik farki
ERROR_ON_ILLEGAL_OVERLAPS: false

# --- Baglanti / fiziksel butunluk kontrolculeri ---------------------------
ERROR_ON_DISCONNECTED_PINS: false
ERROR_ON_LONG_WIRE: false
ERROR_ON_PDN_VIOLATIONS: false

# NOT: Sentez oncesi/sirasi kapilari BILEREK DOKUNULMADAN birakildi --
# ERROR_ON_UNMAPPED_CELLS, ERROR_ON_SYNTH_CHECKS, ERROR_ON_NL_ASSIGN_STATEMENTS
# ve ERROR_ON_LINTER_ERRORS hala true'dur. Bunlar tasarimin YAPISAL
# dogrulugunu korur (surulmeyen sinyal, coklu surucu, unmapped hucre) ve
# ihlalleri fiziksel bir olcume degil gercek bir RTL hatasina isaret eder;
# gevsetilmeleri icin hicbir gerekce yoktur.
