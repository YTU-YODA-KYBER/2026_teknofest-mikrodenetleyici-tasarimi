meta:
  version: 2

# postgrt_timing_repair.yaml ile ayni kontrollu deney; tek fark hold emniyet
# payinin 50 ps yerine 20 ps olmasidir. 50 ps kosusunda gercek hold TNS'i
# yaklasik 70--80 tamponda sifirlanmis, kalan toplam 3817 tamponun buyuk kismi
# yalniz marj icin eklenmistir. DRT egirisi tabandan %9--21 kotu ve tek bir
# hotspot'ta seri/cozumu uzun kalmistir. Bu overlay o tek degiskeni izole eder.
DEDUPLICATE_CORNERS: true
RUN_POST_GRT_RESIZER_TIMING: true

GRT_RESIZER_SETUP_SLACK_MARGIN: 0.025
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.02
GRT_RESIZER_SETUP_MAX_BUFFER_PCT: 50
GRT_RESIZER_HOLD_MAX_BUFFER_PCT: 50
GRT_RESIZER_ALLOW_SETUP_VIOS: false
GRT_RESIZER_FIX_HOLD_FIRST: false
GRT_RESIZER_RUN_GRT: true
