meta:
  version: 2

# Deney: met5'i die genelinde yeniden kullan, ancak SRAM izdususlerini met5'te
# konservatif olarak tamamen kapat. Kurulu OpenROAD met4 macro OBS sekillerini
# maksimum katmana zaten projekte eder; bu ek obstruction yeni bir via modeli
# degil, parcalı %97,8 projeksiyondaki sliver'lari ve fiziksel olarak gecerli
# yatay crossing'leri de kapatan muhafazakar bir kontroldur. DRT ile olumlu
# olculmeden nihai config'e tasinmaz.
RT_MAX_LAYER: met5
RT_CLOCK_MAX_LAYER: met4
SIGNAL_WIRE_RC_LAYERS: [met1, met2, met3, met4, met5]
CLOCK_WIRE_RC_LAYERS: [met2, met3, met4]
GRT_ADJUSTMENT: 0.10

