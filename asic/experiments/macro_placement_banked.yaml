meta:
  version: 2

# ---------------------------------------------------------------------------
#  BANKA-BITISIK MAKRO YERLESIMI  (ring-banked)
#
#  SORUN (olculdu: reports/timing/max_ss_100C_1v60/max.rpt:7-217)
#    Dogrulanmis macro-ring'de data RAM'in dort bankasi bitisik DEGIL:
#      g_2k[0] -> (3284,80) sag-alt kose
#      g_2k[1..3] -> x=80 sol kenar
#    En uzak iki banka arasi Manhattan mesafesi 5.340 um. Dort bankanin
#    32 bit'lik cikislari ortadaki tek bir mux4_2'de bulusmak zorunda.
#    En kotu setup yolu tam olarak bunu odiyor:
#      SRAM dout1[17] -> 36 SERI TAMPON (3.627 um, 11,853 ns) -> mux4_2
#    Yolun %71'i bu tampon zinciri; gercek mantik yalnizca 1,862 ns.
#
#  DEGISIKLIK
#    constraints/macro_placement_banked.cfg, dogrulanmis halkanin
#    KOORDINATLARINI BIREBIR kullanir; yalnizca hangi ORNEGIN hangi slota
#    gittigi degisir:
#      alt satir : instr[0] + data[0..3]   (data dort banka BITISIK)
#      sol sutun : instr[1..3]
#    Die, halo, makro yonu (hepsi N), PDN ve kanal genislikleri degismez.
#
#  HESAPLANAN ETKI (kosum YAPILMADI, olcum bekliyor)
#    data  RAM en uzak banka mesafesi 5.340 -> 2.289 um   (-%57)
#    instr RAM en uzak banka mesafesi 2.289 -> 2.288 um   (degismedi)
#
#  DOGRULAMA DURUMU: HENUZ DRT'DEN GECMEDI.
#  experiments/README.md'deki altin kural geregi, DetailedRouting'den
#  gectigi OLCULMEDEN ana config'e alinmaz.
#
#  Kullanim:
#    python3 scripts/run_flow.py --config config.yaml \
#        --config experiments/macro_placement_banked.yaml --tag <etiket>
# ---------------------------------------------------------------------------
MACRO_PLACEMENT_CFG: dir::constraints/macro_placement_banked.cfg
