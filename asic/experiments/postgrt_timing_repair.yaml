meta:
  version: 2

# Kontrollu deney: Classic akisinin standart OpenROAD.ResizerTimingPostGRT
# adimini acar. Bu adim STA_CORNERS listesindeki butun tanimli kutuphaneleri
# okuyup global-route RC tahminiyle setup ve hold onarimi yapar; ardindan
# detailed placement ve GRT'yi yeniden kosar.
#
# Nihai kosumda post-CTS onarim temizken routed/RCX tasarimda setup WNS
# -24,738 ns, hold WNS -1,751 ns oldu. Bu buyuk fark, yalniz post-CTS tel
# tahminiyle kapanis yapmanin yetersiz oldugunu gosteriyor. Varsayilan
# LibreLane marjlari bilerek degistirilmedi: ilk deney tek degisken olarak
# adimin kendisini izole eder.
DEDUPLICATE_CORNERS: true
RUN_POST_GRT_RESIZER_TIMING: true

GRT_RESIZER_SETUP_SLACK_MARGIN: 0.025
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.05
GRT_RESIZER_SETUP_MAX_BUFFER_PCT: 50
GRT_RESIZER_HOLD_MAX_BUFFER_PCT: 50
GRT_RESIZER_ALLOW_SETUP_VIOS: false
GRT_RESIZER_FIX_HOLD_FIRST: false

# Resizer sonrasinda yeniden GRT yapilmasi, sonraki DRT'nin guncel hucre ve
# netler icin guide kullanmasi icin zorunludur.
GRT_RESIZER_RUN_GRT: true
