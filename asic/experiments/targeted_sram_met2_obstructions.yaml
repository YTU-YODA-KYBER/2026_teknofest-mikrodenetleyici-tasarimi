# Kontrollu DRC deneyi: rtl2gds DRT sonucundaki 14 isin tamamini ureten iki
# SRAM makrosunun met2 izdusu. 12 isaret yz 1 KiB SRAM/net2702, iki isaret
# conv g_2k[1]/net6004,net7646 uzerindedir. Makrolarin sinyal pinleri met3/met4
# katmanlarindadir; bu nedenle met2-only engel pin erisimini kapatmaz.
#
# Her dikdortgen makro ayak izini 2 um disari tasir. Bu, LEF OBS sinirindaki
# sayisal/izgara bosluklarinin GRT guide'i olarak kullanilmasini da engeller.
ROUTING_OBSTRUCTIONS:
  # yz_bram...g_1k: (1760.00, 2241.54) - (2239.78, 2639.04)
  - [met2, 1758.00, 2239.54, 2241.78, 2641.04]
  # conv_accelerator...g_2k[1]: (2563.10, 1575.00) - (3246.20, 1991.54)
  - [met2, 2561.10, 1573.00, 3248.20, 1993.54]

# Bu overlay GRT/DRT tanisi icindir; kalite kapilari ana config'teki degerlerde
# kalir. GRT asimi tek basina kabul olcutu degildir; karar TrDRC ile verilir.
