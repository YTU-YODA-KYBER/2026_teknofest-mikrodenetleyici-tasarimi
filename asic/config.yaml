# ---------------------------------------------------------------------------
#  Saat -- 35,714285714285715 ns = 28 MHz. ASIC'te saat dogrudan clk_i pinidir.
#
#  --- NEDEN 28 MHz? (2026-09-03, olculdu) ---------------------------------
#  30 MHz (33,333333 ns) TAM AKISLA DENENDI VE DUSTU. `run/final30` 78 adimi
#  tamamladi, fizik temizdi (DRC/LVS/XOR/PDN/hold = 0), ama setup ss
#  koselerinde kapanmadi:
#      max_ss_100C_1v60  WNS -2,0116 ns   TNS -494,33 ns   460 ihlalli uc
#      nom_ss_100C_1v60  WNS -1,5145 ns                    416 ihlalli uc
#      min_ss_100C_1v60  WNS -1,0958 ns                    293 ihlalli uc
#  Toplam 1.169 setup ihlali. Yollama DRC 0, anten 1.441 net.
#
#  DIKKAT -- AKIS BUNU DUSURMEZ: LibreLane'in Checker.SetupViolations adimi
#  yalniz `TIMING_VIOLATION_CORNERS = ['*tt*']` koselerini zorlar; ss koseleri
#  yalnizca UYARI uretir (steps/checker.py:531-538, 610-625). MaxSlew ve
#  MaxCap checker'lari ise `['']` ile hicbir koseyi zorlamaz. Bu yuzden
#  "Flow complete." mesaji zamanlamanin kapandigi anlamina GELMEZ; karar
#  daima final/metrics.json icindeki timing__setup_vio__count ve
#  timing__setup__ws__corner:* alanlarindan verilir.
#
#  --- OLCULEN Fmax ---------------------------------------------------------
#  Sabit netlist + sabit rota uzerinde slack periyoda birebir dogrusaldir.
#  `final30`in 460 negatif yolunun TAMAMI tam cevrimlidir (yarim cevrimli
#  ihlal SIFIR), yani sifir-slack periyodu dogrudan hesaplanir:
#      final30  : 33,3333 + 2,0116 = 35,345 ns -> Fmax 28,29 MHz
#      final40c : T0 = 32,93 ns              -> Fmax 30,37 MHz
#  25 MHz hedefiyle kosulan final40c, 30 MHz hedefiyle kosulan final30'dan
#  2,42 ns DAHA HIZLI cikti. Yani kosumdan kosuma dagilim ~2,4 ns'dir ve
#  beyan edilen frekans bu dagilimi karsilayacak paya sahip olmalidir.
#  35,714285 ns, final30'un olculen 35,345 ns tabanina gore +0,37 ns paydadir
#  ve final40c sinifi bir kosumda pay cok daha genistir.
#
#  --- 28 MHz'in BOLUCU AVANTAJI (secimin ikinci gerekcesi) -----------------
#  I2C 400 kHz: 28.000.000 / (2 x 400.000) = 35 TAM SAYI, kalan 0.
#    Uretilen ASIC kopyasindaki Bresenham kesirli bolucu (HALF_REM == 0 dali)
#    tamamen ATIL kalir -> jitter'siz, tam 400,000 kHz.
#    Karsilastirma: 30 MHz'de oran 37,5; 25 MHz'de 31,25 -- ikisi de kesirli
#    bolucu gerektirir.
#  UART 115200: CPB = 243 -> 115.226,3 baud, hata yalniz +%0,023.
#    Karsilastirma: 30 MHz -> CPB 260, +%0,160.
#  Ikisi de scripts/patch_rtl.py ve FPGA/firmware/Makefile tarafindan
#  CLOCK_PERIOD'dan TURETILIR; elle yazilmaz.
#
#  --- KRITIK YOL (final30, taze kosum) -------------------------------------
#      cpu_inst.CORE.core_i.id_stage_i.decoder_i.instr_rdata_i[18]
#        -> 83 kademe ->
#      cpu_inst.CORE.core_i.alu_operand_a_ex[3]
#  Yani ID komut yazmaci -> rs1 adresi -> register-file okuma mux'i ->
#  forwarding -> ID/EX ALU operand yazmaci. 83 kademenin ayristirmasi:
#      gercek mantik            44 kademe  23,618 ns
#      resizer tekrarlayicisi   39 kademe   9,521 ns  (%29)
#  ESKI KAYIT DUZELTMESI: bu blok bir donem kritik yolu ALU bolucusu
#  (ex_stage_i.alu_i.alu_div_i.RemSel_SP) diye veriyordu. O tespit, ESKI
#  final40c veritabani uzerinde yalniz SDC degistirilerek yapilan yeniden
#  analize aitti; TAZE kosumda kritik yol yukaridakidir.
#
#  ESKI KAYIT DUZELTMESI 2: bu blok bir donem "33,3333 ns -> +0,4051 ns /
#  0 ihlal, mevcut fiziksel gerceklemenin kendisi 30 MHz'i ZATEN karsiliyor"
#  diyordu. O da ayni yeniden analizden geliyordu ve TAZE kosumla curudu
#  (-2,0116 ns). Yeniden analiz SIRALAMA icin kullanilir, BEYAN icin degil.
#
#  Ortak I2C RTL'inin CLK_FREQ_HZ parametresi ASIC top yamasinda bu periyoda
#  gore override edilir (scripts/patch_rtl.py -> i2c_clk_freq_hz).
# ---------------------------------------------------------------------------
CLOCK_PORT: clk_i
CLOCK_NET: clk_i
CLOCK_PERIOD: 35.714285714285715
# ---------------------------------------------------------------------------
#  Zamanlama kisitlari (Bolum 3.2 / 6.2)
#  PnR ve signoff ayni dosyayi kullanir.
# ---------------------------------------------------------------------------
PNR_SDC_FILE: dir::constraints/design.sdc
SIGNOFF_SDC_FILE: dir::constraints/design.sdc

# Dokuz post-PnR STA kosesinin her biri yaklasik 1,5--2 GiB bellek kullaniyor.
# LibreLane'in bos STA_THREADS varsayilani tum koseleri ayni anda baslattigi
# icin 16 GiB makinede isletim sistemi akis surucusunu sonlandirdi. Koseler
# bagimsizdir; tek isci yalnizca calisma suresini etkiler, STA sonucunu degil.
STA_THREADS: 1

# PDK varsayilani yalniz fill_2/fill_1 kullanip 2,45 milyon filler instance
# uretti; Magic LEF/DRC 16 GiB makinede OOM oldu. Ayni onayli kutuphane
# ailesinin buyuk filler'larini once kullanmak filler sayisini 1,08 milyona,
# toplam instance sayisini 2,70 milyondan 1,34 milyona dusurdu. Mantik,
# yerlestirme ve yollama geometrisi degismez; yalnız esdeger bosluk doldurma
# hucrelerinin parcalanma boyutu degisir.
FILL_CELLS:
  - sky130_fd_sc_hd__fill_8
  - sky130_fd_sc_hd__fill_4
  - sky130_fd_sc_hd__fill_2
  - sky130_fd_sc_hd__fill_1

# ---------------------------------------------------------------------------
#  Fiziksel makrolar: SKY130 SRAM'leri (Bolum 1.3 -- en az bir SRAM zorunlu)
#
#  Kullanilan makrolar referans SKY130 PDK kurulumundan gelir (Tablo 5'te
#  onaylanmis listede); goruntuler asic/macros/ altina KOPYALANMISTIR.
#
#  Liberty: PDK bu makrolar icin yalnizca TT_1p8V_25C modelini iceriyor.
#  Sartname Bolum 1.2/3.3 bu durumu ongoruyor: ss ve ff corner'larinda da ayni
#  model kullanilir, gerekce asic/README.md Bolum 9.5'te aciklanmistir.
#
#  instances: makro yerlesimleri floorplan asamasinda doldurulur.
# ---------------------------------------------------------------------------
