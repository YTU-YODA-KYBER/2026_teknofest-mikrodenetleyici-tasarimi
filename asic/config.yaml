meta:
  version: 2
  flow: Classic

# ---------------------------------------------------------------------------
#  Tasarim ve teknoloji
# ---------------------------------------------------------------------------
DESIGN_NAME: top_module
PDK: sky130A
STD_CELL_LIBRARY: sky130_fd_sc_hd

# ---------------------------------------------------------------------------
#  RTL girdileri
#
#  USE_SLANG: Yosys'in yerlesik Verilog on ucu bu tasarimdaki SystemVerilog'u
#  okuyamiyor (cf_math_pkg.sv'de fonksiyon ici `automatic` degisken bildirimi
#  ve `unsigned'()` cast'i). slang, LibreLane'in STANDART bir yapilandirma
#  secenegidir -- ozel adim veya ozel akis DEGILDIR.
#
#  --keep-hierarchy: yosys-slang `inout` port baglantilarini modul sinirini
#  koruyarak isleyebiliyor (QSPI/I2C'nin 5 adet tri-state pini ve top_module'un
#  cift yonlu portlari). Hiyerarsi daha sonra SYNTH_HIERARCHY_MODE ile duzlenir.
# ---------------------------------------------------------------------------
USE_SLANG: true
SLANG_ARGUMENTS:
  - "--keep-hierarchy"

